[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/oxihep/oxiplot"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
oxiplot-tex = { path = "crates/oxiplot-tex", version = "0.2.0" }
# Until oxifit is on crates.io it is a git dependency. `version` is kept so the
# switch is just dropping `git`/`tag`.
oxifit = { git = "https://github.com/oxihep/oxifit", tag = "v0.1.1", version = "0.1.1" }
# `oxiplot_tex::font::backend::skrifa::SkrifaMathFont` exposes skrifa types
# (`FontRef`, `OutlinePen`), so oxiplot and oxiplot-tex must resolve the same
# version.
skrifa = "0.50"

[profile.release]
opt-level = 3
lto = "thin"
