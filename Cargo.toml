[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/oxihep/oxiplot"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
# Casts that can lose information: fixed (`From`, `try_from`) or justified
# where they stand. `cast_precision_loss` stays off: the integer → float casts
# are counts and pixel sizes, exact far below 2²⁴.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"

[workspace.dependencies]
oxiplot-tex = { path = "crates/oxiplot-tex", version = "0.12.0" }
# Until oxifit is on crates.io it is a git dependency. `version` is kept so the
# switch is just dropping `git`/`tag`.
oxifit = { git = "https://github.com/oxihep/oxifit", tag = "v0.9.0", version = "0.9.0" }
# `oxiplot_tex::font::backend::skrifa::SkrifaMathFont` exposes skrifa types
# (`FontRef`, `OutlinePen`), so oxiplot and oxiplot-tex must resolve the same
# version.
skrifa = "0.50"

[profile.release]
opt-level = 3
lto = "thin"
