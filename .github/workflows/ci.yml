name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The toolchain every stable job uses. Pinned so a new Rust release (new
  # lints under -D warnings) cannot break main on its own; bump it in a PR.
  RUST_STABLE: "1.100"

jobs:
  test:
    name: test / lint / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: No features, and each feature alone
        run: cargo hack check --workspace --each-feature --no-dev-deps

      - name: Test with no default features
        # An SVG/PDF-only build: no rasterizer, and `$…$` laid out as plain text.
        run: cargo test -p oxiplot --no-default-features

      - name: Default builds do not compile the fitter
        # Only the opt-in `fit` feature (the model overlay and stat box) may
        # bring in oxifit and its formula engine.
        run: |
          set -euo pipefail
          if cargo tree -p oxiplot -e normal | grep -E 'oxifit'; then
            echo "oxiplot (default features) must not depend on oxifit"; exit 1
          fi

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the declared rust-version
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --all-features

  docs:
    name: API docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the docs, denying broken links
        run: cargo doc --no-deps --all-features --workspace

  supply-chain:
    name: supply chain (cargo-deny)
    # RustSec advisories, yanked crates, and dependency sources (crates.io,
    # plus git only from github.com/oxihep). Configured in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  oxihep-lockstep:
    name: oxihep crates resolve once
    # Every oxihep crate must come from one git tag, or Cargo builds two copies
    # and their types stop matching. See oxiroot's RELEASING.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: No oxihep crate is built twice
        run: |
          set -euo pipefail
          dups=$(cargo tree --workspace --all-features --duplicates -e normal,build,dev --depth 0 --prefix none --format '{p}' | grep -E '^oxi(hist|plot|plot-tex|fit|fit-formula|stats|particle) ' || true)
          if [ -n "$dups" ]; then
            echo "These oxihep crates resolve to more than one tag; bump every manifest to the same tag:"
            echo "$dups" | sort -u
            exit 1
          fi
